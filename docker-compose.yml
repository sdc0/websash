services:
    flask-backend:
        build: ./backend
        container_name: flask-backend
        ports:
          - "5000:5000"
        volumes:
          - ./backend/badges.db:/app/badges.db
          - ./backend/images:/app/images
          - ./backend/permissions.json:/app/permissions.json
    
    react-frontend:
        build: ./frontend
        container_name: react-frontend
        ports:
          - "3001:80"

    nginx:
        build: ./nginx
        container_name: nginx
        ports:
          - "443:80"
        depends_on:
          - flask-backend
          - react-frontend
    
    cloudflared:
        image: cloudflare/cloudflared:latest
        command: tunnel --no-autoupdate run
        environment:
          - "TUNNEL_TOKEN=${TUNNEL_TOKEN}"
