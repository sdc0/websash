server {
    listen 80;
    server_name websash.dpdns.org;

    location /api {
        # pass api calls to flask webserver
        proxy_pass http://flask-backend:5000;

        # forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # pass all other calls to react frontend
        proxy_pass http://react-frontend:80;

        # forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # fix for not javascript not enabled
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'Upgrade';
        proxy_cache_bypass $http_upgrade;

        # fix for websocket failing to connect
        proxy_set_header Sec-WebSocket-Key $http_sec_websocker_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # fix for CORS error
        add_header 'Access-Control-Allow-Origin' 'https://websash.dpdns.org' always;
        add_header 'Access-Control-Allow-Method' 'GET, POST' always;
    }
}